      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

            "session": {"cells": [{"code_hash": "5aa5e5b787babfa6da74a6b2f14e4424", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "eeefeab8486356b5cfb995beab7a0d31", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"los-datos-tienen-forma-de-la-curva-a-la-persistencia\"\u003ELos datos tienen forma: de la curva a la persistencia\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003ELaboratorio de la secci\u00f3n I.2 (anticipo del cap\u00edtulo VII). Tomamos puntos con ruido sobre\nuna curva cerrada y calculamos la \u003Cstrong\u003Ehomolog\u00eda persistente en dimensi\u00f3n 1\u003C/strong\u003E con \u003Ccode\u003Eripser\u003C/code\u003E.\nNadie les dice a los puntos que vienen de una curva, y sin embargo el c\u00f3digo de barras lo\nsabe: cada lazo de la curva aparece como \u003Cstrong\u003Euna barra larga\u003C/strong\u003E. El n\u00famero de vueltas mide el\n\u00abrodear\u00bb desde adentro (parado en un punto); la persistencia lo detecta desde afuera, solo\ncon las distancias entre los datos.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7f0d06b1f16c670e9bca776a58824fe8", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "28e0322abcf22187ea9549a0dedf8231", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 2rem'\u003E\u003Cmarimo-ui-element object-id='bkHC-0' random-id='af392658-9382-e040-3233-2009ef7dd847'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;ocho\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#9 AAJgrgh8BAAAAAAAAAACAuSL4EQAAAAAAAAAAAJgrgh8BAAAAAAAAAACAuSL4EQAAAAAAAAAAAJgrgh8BAAAAAAAAAACAufL/AYEN3vIpyE1ZAAAAAElFTkSuQmCC\", \"__metadata__\": {\"image/png\": {\"width\": 1312, \"height\": 572}}}"}, "type": "data"}]}, {"code_hash": "b0da0f1afb57d85956cbb4a5e96584bd", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"que-mirar\"\u003EQu\u00e9 mirar\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EC\u00edrculo:\u003C/strong\u003E una barra larga, y muchas cortas que son ruido. Sub\u00ed el ruido: la barra larga\n  se acorta pero sobrevive mucho m\u00e1s que las otras. Es el \u003Cstrong\u003Eteorema de estabilidad\u003C/strong\u003E del\n  cap\u00edtulo VIII en acci\u00f3n.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EOcho:\u003C/strong\u003E dos barras largas, una por l\u00f3bulo. Desde un punto de un l\u00f3bulo, el n\u00famero de\n  vueltas es \u003Cmarimo-tex class=\"arithmatex\"\u003E||(+1||)\u003C/marimo-tex\u003E; desde el otro, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-1||)\u003C/marimo-tex\u003E. La persistencia no ve el signo: ve los dos lazos.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ELima\u00e7on:\u003C/strong\u003E dos barras de \u003Cstrong\u003Edistinta\u003C/strong\u003E longitud: el lazo grande y el chico. Desde adentro\n  del chico, el n\u00famero de vueltas es \u003Cmarimo-tex class=\"arithmatex\"\u003E||(2||)\u003C/marimo-tex\u003E; la persistencia, en cambio, cuenta dos lazos\n  distintos.\u003C/li\u003E\n\u003Cli\u003EBaj\u00e1 los puntos a 40: con pocos datos, la forma se pierde. Cu\u00e1ntos datos hacen falta para\n  \u00abver\u00bb un lazo es una pregunta central del an\u00e1lisis topol\u00f3gico de datos.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.1", "script_metadata_hash": null}, "version": "1"},
