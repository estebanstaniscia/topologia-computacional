      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

            "session": {"cells": [{"code_hash": "9368ef4406ddba1fa14100d53393f61e", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1101ea0dfdfa3828e8785d7a2c5b89e2", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"union-find-el-costo-medido\"\u003EUnion-find: el costo, medido\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003ELaboratorio de la secci\u00f3n I.1. Medimos, para las tres estrategias de \u003Ccode\u003Etcomp.union_find\u003C/code\u003E,\ncu\u00e1ntos \u003Cstrong\u003Esaltos de puntero\u003C/strong\u003E cuestan las operaciones y qu\u00e9 \u003Cstrong\u003Ealtura\u003C/strong\u003E alcanza el bosque,\nen funci\u00f3n de la cantidad de elementos \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n||)\u003C/marimo-tex\u003E. La teor\u00eda predice:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EEstrategia\u003C/th\u003E\n\u003Cth\u003EAltura m\u00e1xima\u003C/th\u003E\n\u003Cth\u003ECosto de \u003Cmarimo-tex class=\"arithmatex\"\u003E||(m||)\u003C/marimo-tex\u003E operaciones\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eb\u00e1sica\u003C/td\u003E\n\u003Ctd\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(n - 1||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Theta(m\\,n)||)\u003C/marimo-tex\u003E en el peor caso\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Epor tama\u00f1o\u003C/td\u003E\n\u003Ctd\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\log_2 n||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(O(m \\log n)||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Etama\u00f1o + compresi\u00f3n\u003C/td\u003E\n\u003Ctd\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\log_2 n||)\u003C/marimo-tex\u003E, y se aplana con el uso\u003C/td\u003E\n\u003Ctd\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(O(m\\,\\alpha(n))||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EEleg\u00ed una secuencia de operaciones y el tama\u00f1o m\u00e1ximo; los gr\u00e1ficos est\u00e1n en escala\nlog-log, as\u00ed que \u003Cstrong\u003Euna potencia de \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n||)\u003C/marimo-tex\u003E es una recta\u003C/strong\u003E y su pendiente es el exponente.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "384d62b8a09baa523e3fd2bcab253c88", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 2rem'\u003E\u003Cmarimo-ui-element object-id='vblA-0' random-id='ea653011-3cf4-f5a5-7966-d5e598c73e52'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;Peor caso de la b\u00e1sica: Union(1, k) y n veces Find(1)\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eSecuencia\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;Aleatoria: n uniones y n consultas al azar\u0026quot;,\u0026quot;Peor caso de la b\u00e1sica: Union(1, k) y n veces Find(1)\u0026quot;,\u0026quot;\u00c1rbol binomial y n veces Find de la hoja m\u00e1s profunda\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='vblA-1' random-id='88db3bd2-3c3d-75f3-06ab-bf3cb41390e3'\u003E\u003 u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "c8cc67bebac28eb7a5b969391bc731d0", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"que-mirar\"\u003EQu\u00e9 mirar\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPeor caso de la b\u00e1sica:\u003C/strong\u003E la curva de saltos de la b\u00e1sica es paralela a la referencia\n  \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\propto n||)\u003C/marimo-tex\u003E: cada \u003Ccode\u003EFind(1)\u003C/code\u003E recorre la cadena entera. Las otras dos se quedan planas, y\n  la uni\u00f3n por tama\u00f1o queda \u003Cem\u003Eescondida detr\u00e1s\u003C/em\u003E de la compresi\u00f3n: \u003Ccode\u003EUnion(1, k)\u003C/code\u003E cuelga\n  siempre al reci\u00e9n llegado de la ra\u00edz, as\u00ed que el \u00e1rbol nunca pasa de altura 1.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u00c1rbol binomial:\u003C/strong\u003E la uni\u00f3n por tama\u00f1o alcanza \u003Cstrong\u003Eexactamente\u003C/strong\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\log_2 n||)\u003C/marimo-tex\u003E de altura\n  (es su peor caso) y cada \u003Ccode\u003EFind\u003C/code\u003E desde la hoja cuesta \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\log_2 n||)\u003C/marimo-tex\u003E; con compresi\u00f3n, la\n  primera consulta aplana el camino y las dem\u00e1s cuestan un salto: el costo por operaci\u00f3n\n  tiende a una constante.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAleatoria:\u003C/strong\u003E en promedio todo es mucho m\u00e1s barato que en el peor caso; aun as\u00ed la\n  compresi\u00f3n gana.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\"la-inversa-de-ackermann-una-constante-en-la-practica\"\u003ELa inversa de Ackermann: una constante en la pr\u00e1ctica\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ECon la definici\u00f3n de Cormen, Leiserson, Rivest y Stein,\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_0(j) = j + 1||)\u003C/marimo-tex\u003E y \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_k(j) = A_{k-1}^{(j+1)}(j)||)\u003C/marimo-tex\u003E, y \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\alpha(n)||)\u003C/marimo-tex\u003E es el menor \u003Cmarimo-tex class=\"arithmatex\"\u003E||(k||)\u003C/marimo-tex\u003E con\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||(A_k(1) \\ge n||)\u003C/marimo-tex\u003E. Calculamos los primeros valores (el quinto ya no entra en ninguna\ncomputadora):\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "da7b735a369d756da54cf0964e9f27e0", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='RGSE-0' random-id='daf8e606-e88d-6613-7549-17d6def4b70f'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eUmbrales de \u03b1(n)\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-data='\u0026quot;[{\u0026#92;\u0026quot;k\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;A_k(1)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;2\u0026#92;\u0026quot;,\u0026#92;\u0026quot;\u03b1(n) = k para\u0026#92;\u0026quot;:\u0026#92;\u0026quot;n \u2264 2\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;k\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;A_k(1)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;3\u0026#92;\u0026quot;,\u0026#92;\u0026quot;\u03b1(n) = k para\u0026#92;\u0026quot;:\u0026#92;\u0026quot;n = 3\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;k\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;A_k(1)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;7\u0026#92;\u0026quot;,\u0026#92;\u0026quot;\u03b1(n) = k para\u0026#92;\u0026quot;:\u0026#92;\u0026quot;4 \u2264 n \u2264 7\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;k\u0026#92;\u0026quo
